spring:
  application:
    name: kordi-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kordi}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

  # schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
  # An existing database without flyway_schema_history (production before Flyway) is baselined
  # at version 1 — V1 is the schema it already has — and only later versions run on it.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  # several scheduler threads: the world's 100 ms move flush must not wait behind a slow
  # socket write or the ticket/run sweeps (the default is a single thread)
  task:
    scheduling:
      pool:
        size: 4

  jpa:
    # API server: no lazy loading in views; services return DTOs inside their transactions
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # timestamps are Instants stored as UTC wall-clock in DATETIME(6) columns
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}

server:
  port: 8080
  # behind Caddy: trust X-Forwarded-* from the proxy (Tomcat RemoteIpValve — only internal
  # addresses count as proxies), so the app sees the real scheme (Secure cookies, https links)
  forward-headers-strategy: native

# Actuator: only health and info go out over HTTP (public, see SecurityConfig). Health shows the
# status alone — no component details, no versions, no connection info — and is DOWN when the DB is
# unreachable (the db indicator is on by default). For the proxy / container probes:
#   /actuator/health            overall (DB included)
#   /actuator/health/liveness   the JVM is up (don't restart on a DB blip)
#   /actuator/health/readiness  ready for traffic (includes the DB)
# /health-check stays as it was (no DB) for existing probes. Metrics (JVM, Hikari, HTTP) are
# collected but not exposed over HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  info:
    env:
      enabled: false

# OpenAPI spec at /v3/api-docs — off by default (production). It is not a public path either:
# even when enabled it needs a signed-in user. The client's types are generated from a spec
# the test suite writes to build/openapi.json (OpenApiSpecExportTest), not from a live server.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    version: openapi_3_0
  paths-to-match: /api/**
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

app:
  oauth2:
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:3000/api/auth/callback}
    # production origins only; local dev falls back to redirect-url (localhost) when unset,
    # or set OAUTH2_ALLOWED_REDIRECT_ORIGINS to include http://localhost:3000
    allowed-redirect-origins: ${OAUTH2_ALLOWED_REDIRECT_ORIGINS:https://kordi.online,https://www.kordi.online}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://www.kordi.online,https://kordi.online}
