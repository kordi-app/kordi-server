services:
  mysql:
    image: mysql:8.0
    container_name: kordi-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kordi-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: kordi-api:latest
    container_name: kordi-api
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  kordi-mysql-data: